name: Gmail refresh reminder

on:
  schedule:
    # Morning in America/New_York: 9:00 EDT (13:00 UTC) and 9:00 EST (14:00 UTC).
    # The job no-ops until the token is inside the last 12 hours of its 7-day life.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Open a reminder issue when the token is due
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GMAIL_TOKEN_REFRESHED_AT: ${{ vars.GMAIL_TOKEN_REFRESHED_AT }}
        run: node scripts/gmail-refresh-reminder.mjs
